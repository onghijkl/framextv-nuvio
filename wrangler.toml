# Cloudflare Workers configuration for the PvrPlay Catalogs addon.
#
# This lets Cloudflare deploy the addon straight from this repository, so
# updates (for example when PvrPlay rotates its subdomain) go live on push
# with no manual copy-paste.
#
# The Worker is a single dependency-free ES module, so there is no build step.

name = "pvrplay-catalogs"
main = "addon/worker.js"
compatibility_date = "2025-09-01"

# Deployed to the free *.workers.dev subdomain.
workers_dev = true
